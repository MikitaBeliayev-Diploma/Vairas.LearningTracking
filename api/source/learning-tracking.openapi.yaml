        and correctionReason. Reverify current source and enrollment/program scope. Keep prior versions and their
        confirmations; the new version requires fresh participant confirmations before credit. Preserve material
        identity and fail CAS conflicts without partial writes.
      x-status: proposed
      responses:
        '201':
          description: Successful result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PracticalRecord'
              examples:
                typical:
                  summary: Successful result
                  value:
                    recordId: 11111111-1111-4111-8111-111111111111
                    enrollmentId: 11111111-1111-4111-8111-111111111111
                    revision: 2
                    factVersion: 2
                    status: Pending
                    facts:
