      description: Authenticate the assigned teacher, verify exact school/lesson authority, expectedRevision and
        factVersion, and recheck current completed-valid source and full as-of roster. Only a Valid current version
        may be teacher-confirmed; students and administrators cannot substitute that teacher. Atomically retain
        confirmation and advance revision. Present contributes once, Absent zero; a source correction blocks eligibility
        and needs new facts plus fresh confirmation. Exact idempotent retries reuse the result.
