components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    workloadBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Service-to-service token; dedicated audience and workload scope.
  schemas:
    Problem:
      type: object
      required:
      - title
      - status
      - code
      - correlationId
      properties:
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        correlationId:
          type: string
      description: Problem. See the operation descriptions for authorization and lifecycle constraints.
    ConfirmedPracticalRecords:
      type: object
      required:
      - enrollmentId
      - records
      - snapshotVersion
      properties:
        enrollmentId:
          type: string
          format: uuid
        snapshotVersion:
          type: string
        records:
          type: array
          items:
            type: object
            required:
            - recordId
            - revision
            - actualMinutes
            properties:
              recordId:
                type: string
                format: uuid
              revision:
                type: integer
              actualMinutes:
                type: integer
      description: Confirmed Practical Records. See the operation descriptions for authorization and lifecycle constraints.
    Progress:
      type: object
      required:
      - enrollmentId
      - theoryMinutes
      - practicalMinutes
      - percent
      - outstandingRequirements
      - pendingRecordCount
      properties:
        enrollmentId:
          type: string
          format: uuid
        theoryMinutes:
          type: integer
        practicalMinutes:
          type: integer
        percent:
          type: number
          minimum: 0
          maximum: 100
        outstandingRequirements:
          type: array
          items:
            type: string
        pendingRecordCount:
          type: integer
          minimum: 0
      description: Progress. See the operation descriptions for authorization and lifecycle constraints.
    ConfirmationRequest:
      type: object
      required:
      - revision
      properties:
        revision:
          type: integer
          minimum: 1
          description: Exact immutable current factVersion being confirmed, not the aggregate revision. Both participant
            roles confirm this same fact version; reject an older or permanently disputed version.
      description: Confirmation Request. See the operation descriptions for authorization and lifecycle constraints.
    ConfirmationResult:
      type: object
      required:
      - recordId
      - revision
      - status
      properties:
        recordId:
          type: string
          format: uuid
        revision:
          type: integer
          description: The immutable fact version addressed by this confirmation.
        status:
          type: string
          enum:
          - Pending
          - Confirmed
          - Disputed
      description: Confirmation Result. See the operation descriptions for authorization and lifecycle constraints.
    PracticalFacts:
      type: object
      required:
      - schoolId
      - enrollmentId
      - lessonId
      - programVersionId
      - sourceSnapshotId
      - trainingMinutes
      - distanceKm
      - topicIds
      properties:
        schoolId: &id001
          type: string
          format: uuid
        enrollmentId: *id001
        lessonId: *id001
        programVersionId: *id001
        sourceSnapshotId: *id001
        trainingMinutes: &id002
          type: integer
          minimum: 1
        distanceKm:
          type: number
          minimum: 0
        topicIds:
          type: array
          items:
            type: string
            format: uuid
        durationExplanation:
          type: string
        expectedRevision: *id002
        correctionReason:
          type: string
      description: Practical Facts. See the operation descriptions for authorization and lifecycle constraints.
    PracticalRecord:
      type: object
      required:
      - recordId
      - enrollmentId
      - revision
      - factVersion
      - status
      - facts
      - responses
      properties:
        recordId: &id003
          type: string
          format: uuid
        enrollmentId: *id003
        revision: &id004
          type: integer
          minimum: 1
        factVersion: *id004
        status:
          type: string
          enum:
          - Pending
          - Confirmed
          - Disputed
          - Invalid
        facts:
          $ref: '#/components/schemas/PracticalFacts'
        responses:
          type: array
          items:
            type: object
            required:
            - role
            - response
            - factVersion
            properties:
              role:
                type: string
                enum:
                - Instructor
                - Student
              response:
                type: string
                enum:
                - Confirm
                - Dispute
              factVersion:
                type: integer
                minimum: 1
      description: Practical Record. See the operation descriptions for authorization and lifecycle constraints.
    Dispute:
      type: object
      required:
      - revision
      - reason
      properties:
        revision:
          type: integer
          minimum: 1
          description: The immutable fact version being disputed, not an aggregate concurrency token.
        reason:
          type: string
          minLength: 1
      description: Dispute. See the operation descriptions for authorization and lifecycle constraints.
    Readiness:
      type: object
      required:
      - enrollmentId
      - evaluationId
      - prerequisitesSatisfied
      - outstandingRequirements
      - decision
      properties:
        enrollmentId: &id005
          type: string
          format: uuid
        evaluationId: *id005
        prerequisitesSatisfied:
          type: boolean
        outstandingRequirements:
          type: array
          items:
            type: string
        decision:
          type: string
          enum:
          - Pending
          - Approved
          - NotApproved
      description: Readiness. See the operation descriptions for authorization and lifecycle constraints.
    ReadinessDecision:
      type: object
      required:
      - evaluationId
      - expectedRevision
      - decision
      - reason
      properties:
        evaluationId:
          type: string
          format: uuid
        expectedRevision:
          type: integer
          minimum: 1
        decision:
          type: string
          enum:
          - Approved
          - NotApproved
        reason:
          type: string
          minLength: 1
      description: Readiness Decision. See the operation descriptions for authorization and lifecycle constraints.
    AssessmentResult:
      type: object
      required:
      - enrollmentId
      - assessmentDefinitionVersionId
      - stage
      - result
      - assessedAt
      - expectedRevision
      - trainingKind
      properties:
        enrollmentId: &id006
          type: string
          format: uuid
        assessmentDefinitionVersionId: *id006
        stage:
          type: string
          enum:
          - Midterm
          - Final
        result:
          type: string
          enum:
          - Passed
          - Failed
        assessedAt:
          type: string
          format: date-time
        expectedRevision:
          type: integer
          minimum: 1
        trainingKind:
          type: string
          enum:
          - Theory
          - Practical
      description: Assessment Result. See the operation descriptions for authorization and lifecycle constraints.
    Assessment:
      type: object
      required:
      - assessmentId
      - revision
      - result
      properties:
        assessmentId:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
        result:
          type: string
          enum:
          - Passed
          - Failed
      description: Assessment. See the operation descriptions for authorization and lifecycle constraints.
    Evidence:
      type: object
      required:
      - enrollmentId
      - snapshotVersion
      - ready
      - outstandingItems
      properties:
        enrollmentId:
          type: string
          format: uuid
        snapshotVersion:
          type: string
        ready:
          type: boolean
        outstandingItems:
          type: array
          items:
            type: string
      description: Evidence. See the operation descriptions for authorization and lifecycle constraints.
    TheoryFacts:
      type: object
      additionalProperties: false
      required:
      - schoolId
      - lessonId
      - sourceSnapshotId
      - trainingMinutes
      - attendanceRows
      properties:
        schoolId:
          type: string
          format: uuid
        lessonId:
          type: string
          format: uuid
        sourceSnapshotId:
          type: string
          format: uuid
        trainingMinutes:
          type: integer
          minimum: 1
        durationExplanation:
          type: string
        attendanceRows:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - enrollmentId
            - studentId
            - attendance
            properties:
              enrollmentId:
                type: string
                format: uuid
              studentId:
                type: string
                format: uuid
              attendance:
                type: string
                enum:
                - Present
                - Absent
      description: Facts for one whole group lesson, not one student. The complete immutable attendanceRows must
        equal the verified as-of group roster from the current Scheduling source; no omitted, extra, duplicate or
        mismatched enrollment/student pairs. Verify each pinned student programme independently. Present earns full
        minutes only after current-source validation and teacher confirmation; Absent earns zero. No partial attendance
        or automatic credit on completion.
    TrainingEnrollment:
      type: object
      required:
      - schoolId
      - enrollmentId
      - programVersionId
      properties:
        schoolId: &id007
          type: string
          format: uuid
        enrollmentId: *id007
        programVersionId: *id007
    TheoryRecord:
      type: object
      required:
      - recordId
      - schoolId
      - lessonId
      - revision
      - factVersion
      - validation
      - confirmed
      - facts
      properties:
        recordId:
          type: string
          format: uuid
        schoolId:
          type: string
          format: uuid
        lessonId:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
        factVersion:
          type: integer
          minimum: 1
        validation:
          type: string
          enum:
          - Incomplete
          - Valid
          - Invalid
        confirmed:
          type: boolean
        facts:
          $ref: '#/components/schemas/TheoryFacts'
      description: Current group theory record. revision is the aggregate CAS token; factVersion identifies immutable
        facts. confirmed is derived from the confirmation on that version; source freshness must still be verified
        before any credit.
    RevisedPracticalFacts:
      allOf:
      - $ref: '#/components/schemas/PracticalFacts'
      - type: object
        required:
        - expectedRevision
        - correctionReason
        properties:
          correctionReason:
            type: string
            minLength: 1
            pattern: .*\S.*
      description: Append a new immutable practical fact version with CAS and an audit reason; old confirmations
        remain on their original version and never transfer.
    RevisedTheoryFacts:
      type: object
      additionalProperties: false
      required:
      - schoolId
      - lessonId
      - sourceSnapshotId
      - trainingMinutes
      - attendanceRows
      - expectedRevision
      - correctionReason
      properties:
        schoolId:
          type: string
          format: uuid
        lessonId:
          type: string
          format: uuid
        sourceSnapshotId:
          type: string
          format: uuid
        trainingMinutes:
          type: integer
          minimum: 1
        durationExplanation:
          type: string
        attendanceRows:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - enrollmentId
            - studentId
            - attendance
            properties:
              enrollmentId:
                type: string
                format: uuid
              studentId:
                type: string
                format: uuid
              attendance:
                type: string
                enum:
                - Present
                - Absent
        expectedRevision:
          type: integer
          minimum: 1
        correctionReason:
          type: string
          minLength: 1
          pattern: .*\S.*
      description: A complete replacement fact version for the same school/lesson; retain prior facts and confirmation,
        increment version/revision and require fresh teacher confirmation.
    TheoryConfirmation:
      type: object
      additionalProperties: false
      required:
      - expectedRevision
      - factVersion
      properties:
        expectedRevision:
          type: integer
          minimum: 1
        factVersion:
          type: integer
          minimum: 1
      description: The assigned teacher explicitly confirms the reviewed full roster and minutes of this exact current
        version. Confirmation authority is server-derived; students do not confirm theory attendance.
